name: AZRNOU Quality Gate

on:
  push:
    branches: [azrnou-production]
  pull_request:
    branches: [azrnou-production]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: azrnou
          POSTGRES_PASSWORD: azrnou
          POSTGRES_DB: azrnou_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U azrnou -d azrnou_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://azrnou:azrnou@localhost:5432/azrnou_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Database migrations
        run: npm run db:migrate
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
