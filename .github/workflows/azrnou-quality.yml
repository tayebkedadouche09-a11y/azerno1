name: AZRNOU Quality Gate

on:
  push:
    branches: [azrnou-production, azrnou-p1-verify5, azrnou-p0-impl2]
  pull_request:
    branches: [azrnou-production, azrnou-p1-verify5]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: azrnou
          POSTGRES_PASSWORD: azrnou
          POSTGRES_DB: azrnou_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U azrnou -d azrnou_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://azrnou:azrnou@localhost:5432/azrnou_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Migrations 001-026
        run: npm run db:migrate
      - name: TypeScript
        run: npm run lint
      - name: Integration tests
        run: npx tsx --test server/__tests__/integration.test.ts server/__tests__/idempotency.test.ts server/__tests__/api_idempotency.test.ts server/__tests__/offline_queue_contract.test.ts server/__tests__/payment_expense_idempotency.test.ts server/__tests__/intelligence_contract.test.ts
        continue-on-error: false
      - name: RLS proof SQL
        run: |
          PGPASSWORD=azrnou psql -h localhost -U azrnou -d azrnou_test -v ON_ERROR_STOP=1 -f server/__tests__/rls_proof.sql
        continue-on-error: false
      - name: RLS DML as azrnou_app
        run: |
          PGPASSWORD=azrnou psql -h localhost -U azrnou -d azrnou_test -v ON_ERROR_STOP=1 -f server/__tests__/rls_dml_as_app.sql
        continue-on-error: false
      - name: Production build
        run: npm run build
